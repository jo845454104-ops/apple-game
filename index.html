<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🍎 사과게임 - 입장</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css?v=59" />
  <script>
    try {
      var saved = localStorage.getItem("apple-game-theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}
  </script>
</head>
<body class="gate-body">
  <main class="gate">
    <p class="gate__apple">🍎</p>
    <h1 class="gate__title">사과게임</h1>
    <p class="gate__sub">DSA 아카데미 학생용</p>

    <p class="gate__note">받은 <strong>입장 코드</strong>를 넣으세요.<br />한 코드는 한 사람만 쓸 수 있습니다.</p>

    <div class="gate__row">
      <input
        type="text"
        id="pass-input"
        maxlength="8"
        placeholder="영문·숫자 8자리"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      />
      <button type="button" class="play-btn" id="pass-btn">입장</button>
    </div>

    <p class="gate__status" id="pass-status"></p>

    <p class="gate__help">
      코드가 없으면 정식공주에게 받으세요.<br />
      코드는 이 브라우저에 저장되어 다음부터는 자동으로 들어갑니다.
    </p>
  </main>

  <script type="module" src="gate.js?v=59"></script>
</body>
</html>
